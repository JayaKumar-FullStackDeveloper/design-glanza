<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design-Glanza Icon Packages — Lucide + Heroicons preview</title>
<style>
  :root{ --bg:#f7f8f9; --card:#fff; --line:#e4e4e7; --text:#111318; --muted:#6b7480; --accent:#3130ba; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px;z-index:10}
  header h1{margin:0 0 4px;font-size:18px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .controls input[type=search]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .controls select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
  .controls label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  main{padding:20px 24px 60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
  .cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:border-color .1s}
  .cell:hover{border-color:var(--accent)}
  .cell img{width:28px;height:28px}
  .cell .nm{font-size:10px;color:var(--muted);text-align:center;word-break:break-word;line-height:1.3;max-width:100%}
  .cell .set{font-size:9px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .dark .cell{background:#1b1d22;border-color:#363c45}
  .dark{background:#111318;color:#f7f8f9}
  .dark .cell .nm{color:#9aa3ac}
  .dark header{background:#1b1d22;border-color:#363c45}
  .dark .controls input,.dark .controls select{background:#1b1d22;color:#f7f8f9;border-color:#363c45}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111318;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s}
  .toast.show{opacity:1}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
</style>
</head>
<body>
<header>
  <h1>Design-Glanza Icon Packages</h1>
  <p>Lucide v1.52.0 (ISC) — 2130 icons · Heroicons v2.2.0 (MIT) — 324 icons × 4 size/style variants. Click any icon to copy its relative path.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search icons by name…" autofocus>
    <select id="setFilter">
      <option value="">All sets</option>
      <option value="lucide">Lucide only</option>
      <option value="heroicons">Heroicons only</option>
    </select>
    <select id="variantFilter">
      <option value="">All variants</option>
      <option value="icons">Lucide: icons</option>
      <option value="16-solid">Heroicons: 16 solid</option>
      <option value="20-solid">Heroicons: 20 solid</option>
      <option value="24-outline">Heroicons: 24 outline</option>
      <option value="24-solid">Heroicons: 24 solid</option>
    </select>
    <label><input type="checkbox" id="darkToggle"> Dark</label>
    <span class="count" id="count"></span>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>
<div class="toast" id="toast"></div>

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const setFilter = document.getElementById('setFilter');
const variantFilter = document.getElementById('variantFilter');
const countEl = document.getElementById('count');
const toast = document.getElementById('toast');
const darkToggle = document.getElementById('darkToggle');

function render(){
  const term = q.value.trim().toLowerCase();
  const setV = setFilter.value;
  const varV = variantFilter.value;
  const items = ICONS.filter(it =>
    (!term || it.name.includes(term)) &&
    (!setV || it.set === setV) &&
    (!varV || it.variant === varV)
  );
  countEl.textContent = items.length + ' / ' + ICONS.length;
  if (items.length === 0) { grid.innerHTML = '<div class="empty">No icons match.</div>'; return; }
  // Cap live render for very broad queries to keep the page snappy; narrow the search for more.
  const capped = items.slice(0, 600);
  grid.innerHTML = capped.map(it =>
    '<div class="cell" data-path="' + it.path + '" title="' + it.path + '">' +
      '<img src="' + it.path + '" loading="lazy" alt="">' +
      '<span class="set">' + it.set + (it.set==='heroicons' ? ' '+it.variant : '') + '</span>' +
      '<span class="nm">' + it.name + '</span>' +
    '</div>'
  ).join('');
  if (items.length > capped.length) {
    grid.insertAdjacentHTML('beforeend', '<div class="empty">+' + (items.length - capped.length) + ' more — narrow your search to see them.</div>');
  }
}

grid.addEventListener('click', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const p = cell.dataset.path;
  navigator.clipboard?.writeText(p).catch(()=>{});
  toast.textContent = 'Copied: ' + p;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
});

q.addEventListener('input', render);
setFilter.addEventListener('change', render);
variantFilter.addEventListener('change', render);
darkToggle.addEventListener('change', () => document.body.classList.toggle('dark', darkToggle.checked));

render();
</script>
